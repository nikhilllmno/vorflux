# gitleaks configuration. Runs in CI on every PR (.github/workflows/ci.yml) and locally:
#   gitleaks git --config .gitleaks.toml .
# No path allowlists on purpose: `.env.example` is scanned like any other file, and a
# separate CI step fails if any of its variables has a value.
title = "hotel agent harness"

[extend]
useDefault = true
