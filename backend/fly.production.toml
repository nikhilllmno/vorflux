# Fly.io config for the control-plane API, PRODUCTION. Not deployed by this repo or by CI.
# A human deploys with owner approval: see docs/runbook-deploy.md.
# Deploy explicitly: `fly deploy --config fly.production.toml` from backend/. Never the default.
# Secrets are set with `fly secrets set` (names in docs/infra-map.md), never in this file.

app = "vorflux-harness-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "bluegreen"

[env]
  HARNESS_ENVIRONMENT = "production"
  HARNESS_LOG_LEVEL = "INFO"
  HARNESS_CORS_ORIGINS = '["https://vorflux-harness-web.vercel.app"]'
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
