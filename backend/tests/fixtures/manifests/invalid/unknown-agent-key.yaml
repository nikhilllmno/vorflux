# Invalid: agents may not carry extra keys such as secrets (expected path: agents[0].api_key)
version: 1
layout: standard/v1
hotel: broken-hotel
agents:
  - type: voice
    platform: vapi
    prompt_dir: prompts/voice
    config_path: vapi/assistant.yaml
    test_assistant: broken-hotel-test
    api_key: not-a-real-key
commands:
  setup: uv sync --locked
  lint: uv run ruff check .
  test: uv run pytest -q
  render: uv run python -m hotel.render --check
  eval: uv run python -m evals.run --suite full
change_classes:
  content: [kb/**]
deploy:
  owner: target-repo-ci
